# ===== サイトの基本設定 =====
title: 💖らびこ💖のブログ
name: "Rabbitflowerdiary"          # フッターの © の後に出る名前
email: rabiko@rabbitflowerdiary.com
description: >-
  💖らびこ💖の毎日のSNS投稿とおすすめのアイテムをご紹介しています🐰✨💐🪄
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

# ===== テーマ =====
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"   # 色は assets/css/main.scss で上書きしています

plugins:
  - jekyll-include-cache

# 左上のタイトルの横に出る、小さな丸い画像
logo: "/assets/images/rabiko-logo.webp"

# ===== 左のカラム（キャラクター紹介） =====
author:
  name: "らびこ"
  avatar: "/assets/images/rabiko.webp"
  bio: "💖らびこ💖の毎日のSNS投稿とおすすめのアイテムをご紹介しています🐰✨💐🪄"
  links:
    - label: "うさの国"
      icon: "fas fa-fw fa-link"
      url: "https://rabbitflowerdiary.com"
    - label: "SUZURI"
      icon: "fas fa-fw fa-link"
      url: "https://suzuri.jp/Rabbitflower"

# ===== フッター =====
atom_feed:
  hide: true                       # 「FEED」のリンクを消す
footer:
  links:                           # 代わりに、かわいいリンクを並べる
    - label: "🐰 うさの国"
      icon: "fas fa-fw fa-link"
      url: "https://rabbitflowerdiary.com"
    - label: "🛍️ SUZURI"
      icon: "fas fa-fw fa-link"
      url: "https://suzuri.jp/Rabbitflower"

# ===== 記事のページ設定（左カラムを出し、不要な表示を消す） =====
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
